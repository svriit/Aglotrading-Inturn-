version: "3.8"

services:
  aglo-trading:
    build: .
    container_name: aglo-trading
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - DERIV_APP_ID=${DERIV_APP_ID:-1089}
      - DERIV_OAUTH_REDIRECT_URL=${DERIV_OAUTH_REDIRECT_URL:-http://localhost:5000/oauth/callback}
    restart: unless-stopped
